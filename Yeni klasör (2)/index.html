<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>lexir</title>

<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:url("bg.gif") center center / cover no-repeat;
    font-family:Arial, sans-serif;
}

/* Ana yazı */
#mainLink{
    font-size:40px;
    text-decoration:none;
    animation:flashBW 0.18s infinite;
    text-shadow:0 0 8px rgba(0,0,0,0.6);
}

/* Siyah beyaz hızlı yanıp sönme */
@keyframes flashBW{
    0%{color:white;}
    50%{color:black;}
    100%{color:white;}
}

/* Alt instagram */
#insta{
    position:absolute;
    bottom:25px;
    font-size:16px;
    color:white;
    text-decoration:none;
    opacity:0.8;
}

/* Partiküller */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}
</style>
</head>

<body>

<a id="mainLink" href="https://guns.lol/lexir" target="_blank">
https://guns.lol/lexir
</a>

<a id="insta" href="https://www.instagram.com/tr4shgxd" target="_blank">
@tr4shgxd
</a>

<audio id="music" src="ses.mp3" autoplay loop></audio>

<canvas id="particles"></canvas>

<script>
/* Ses otomatik başlat */
let music = document.getElementById("music");
music.volume = 0.4;

/* Linke tıklayınca fade out */
document.getElementById("mainLink").addEventListener("click", function(){
    let fade = setInterval(function(){
        if(music.volume > 0.02){
            music.volume -= 0.02;
        }else{
            music.pause();
            clearInterval(fade);
        }
    },100);
});

/* Partiküller */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<80;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        size:Math.random()*2+1,
        speedY:Math.random()*1+0.5
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
        p.y+=p.speedY;
        if(p.y>canvas.height){
            p.y=0;
            p.x=Math.random()*canvas.width;
        }
    });
    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
